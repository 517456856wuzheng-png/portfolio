// ===== MATRIX RAIN =====
function MatrixRain() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ0123456789ABCDEF';
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);
    const colors = ['#39FF14', '#00F0FF', '#FF0040', '#BF00FF'];
    const draw = () => {
      ctx.fillStyle = 'rgba(5,5,5,.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for(let i=0;i<drops.length;i++){
        const char = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
        ctx.globalAlpha = .5 + Math.random()*.5;
        ctx.font = `${fontSize}px "JetBrains Mono", monospace`;
        ctx.fillText(char, i*fontSize, drops[i]*fontSize);
        ctx.globalAlpha = 1;
        if(drops[i]*fontSize>canvas.height&&Math.random()>.975) drops[i]=0;
        drops[i]++;
      }
    };
    const interval = setInterval(draw, 50);
    return () => { clearInterval(interval); window.removeEventListener('resize', resize); };
  }, []);
  return React.createElement('canvas', { ref: canvasRef, className: 'matrix-canvas' });
}

// ===== CUSTOM CURSOR =====
function CustomCursor({proMode}) {
  const cursorRef = useRef(null);
  const trailRef = useRef(null);
  const [active, setActive] = useState(false);
  useEffect(() => {
    const move = (e) => {
      if(cursorRef.current){ cursorRef.current.style.left = e.clientX+'px'; cursorRef.current.style.top = e.clientY+'px'; }
      if(trailRef.current) setTimeout(() => { if(trailRef.current){ trailRef.current.style.left = e.clientX+'px'; trailRef.current.style.top = e.clientY+'px'; } }, 80);
    };
    const down = () => setActive(true);
    const up = () => setActive(false);
    window.addEventListener('mousemove', move);
    window.addEventListener('mousedown', down);
    window.addEventListener('mouseup', up);
    return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mousedown', down); window.removeEventListener('mouseup', up); };
  }, []);
  return React.createElement(React.Fragment, null,
    React.createElement('div', { ref: cursorRef, className: `custom-cursor ${active?'active':''} ${proMode?'pro-cursor':''}` }),
    React.createElement('div', { ref: trailRef, className: 'cursor-trail' })
  );
}
